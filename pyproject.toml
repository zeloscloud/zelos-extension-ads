[project]
name = "zelos-extension-ads"
version = "0.1.0"
description = "Trace Beckhoff TwinCAT PLC variables over ADS by notification or polling. Read and write symbols, add routes, and read EtherCAT diagnostics. On Linux and macOS, add this machine's route to each target from the app; Windows with TwinCAT and Beckhoff devices use the routes in their own TwinCAT router."
authors = [{ name = "Zelos", email = "support@zeloscloud.io" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["zelos", "extension", "ads", "twincat", "beckhoff", "industrial", "plc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "zelos-sdk>=0.0.13a1",
    # 3.6: prebuilt AdsLib, Beckhoff RT Linux detection; <3.7: PyadsLink.close uses pyads internals
    "pyads>=3.6,<3.7",
    "rich-click>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-ads"
Repository = "https://github.com/zeloscloud/zelos-extension-ads"
Issues = "https://github.com/zeloscloud/zelos-extension-ads/issues"
Documentation = "https://docs.zeloscloud.io/app/extensions/"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.9.5"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_ads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"
asyncio_mode = "auto"

[tool.ruff]
target-version = 'py311'
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "B008",   # function call in defaults (common in decorators)
]

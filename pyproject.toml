[project]
name = "zelos-extension-ads"
version = "0.1.0"
description = "Beckhoff TwinCAT ADS extension for Zelos: trace PLC variables by notification or polling, read and write symbols"
authors = [{ name = "Zelos Cloud", email = "support@zeloscloud.io" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["zelos", "extension", "ads", "twincat", "beckhoff", "industrial", "plc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]
dependencies = [
    # 0.0.13a1 floor, as the other agent extensions: hidden/standalone actions
    # (auto_config, add_route) need the at-rest harness, and a prerelease floor
    # on the direct dep is what lets uv resolve one.
    "zelos-sdk>=0.0.13a1",
    # 3.6 floor: prebuilt AdsLib for macOS/Linux x86_64+aarch64 (no native build at
    # install) and the Beckhoff RT Linux detection that uses the device's own router.
    # 3.7 ceiling: `PyadsLink.close` reaches into pyads internals (port, callback store).
    "pyads>=3.6,<3.7",
    "rich-click>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/zeloscloud/zelos-extension-ads"
Repository = "https://github.com/zeloscloud/zelos-extension-ads"
Issues = "https://github.com/zeloscloud/zelos-extension-ads/issues"
Documentation = "https://docs.zeloscloud.io/extensions"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pre-commit>=4.3.0",
    "ruff>=0.14.2",
    "tomli>=2.3.0; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zelos_extension_ads"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--log-cli-level=INFO"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
]
ignore = [
    "B008",   # function call in defaults (common in decorators)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["PTH123"]  # Allow open() in scripts

[tool.ruff.lint.pydocstyle]
convention = "google"

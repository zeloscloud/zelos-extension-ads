name = "ADS"
version = "0.1.0"
description = "Trace Beckhoff TwinCAT PLC variables over ADS by notification or polling. Read and write symbols, add routes, and read EtherCAT diagnostics. On Linux and macOS, add this machine's route to each target from the app; Windows with TwinCAT and Beckhoff devices use the routes in their own TwinCAT router."
author = "Zelos"
repository = "https://github.com/zeloscloud/zelos-extension-ads"
# At most 20 keywords and 10 categories. Marketplace search matches both, the name, description,
# author and repository. Zelos AI sees the name, description and keywords, not the categories.
keywords = ["ads", "twincat", "beckhoff", "industrial", "plc", "automation", "twincat 3", "ams", "ams net id", "amsnetid", "symbol", "notification", "route", "adstool", "pyads", "plc variable", "ethercat diagnostics", "coe", "sdo"]
categories = ["Industrial", "IoT", "Protocol", "Diagnostics", "Networking"]
icon = "assets/icon.png"
readme = "README.md"

[zelos]
version = ">=26.0.10"

[config]
schema = "config.schema.json"

[agent]
runtime = "python"
entry = "main.py"
python_version = "3.11"

[package]
paths = ["LICENSE", "main.py", "zelos_extension_ads"]
